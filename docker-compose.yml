version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: ai_parliament_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: ai_parliament_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
